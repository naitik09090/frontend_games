<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Hub – Play Free Online Games</title>
    <meta name="description" content="Play a collection of free online games including puzzle, sorting, and adventure games. Fun for all ages!" />

    <!-- ─── Critical inline CSS ───────────────────────────────────────────
         Paint the page background & baseline immediately — zero blocking.
         Keeps the viewport from flashing white while the full bundle loads.
    ──────────────────────────────────────────────────────────────────────── -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{
        min-height:100vh;
        background:#0f0c29;
        color:#fff;
        font-family:'Outfit','Inter',system-ui,sans-serif;
        -ms-overflow-style:none;
        scrollbar-width:none;
      }
      body::-webkit-scrollbar{display:none}
      #root{min-height:100vh}
      /* Skeleton loader so page looks alive before React hydrates */
      #root:empty::after{
        content:'';
        display:block;
        width:40px;height:40px;
        margin:40vh auto 0;
        border:3px solid rgba(0,210,255,.3);
        border-top-color:#00d2ff;
        border-radius:50%;
        animation:_spin .75s linear infinite;
      }
      @keyframes _spin{to{transform:rotate(360deg)}}

      /* font-display swap so text renders immediately with system font */
      @font-face {
        font-family: "bootstrap-icons";
        src: url("/bootstrap-icons.woff2") format("woff2");
        font-display: swap;
      }
    </style>

    <!-- ─── Preconnect to CDNs (DNS + TLS resolved before requests land) ── -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ─── Bootstrap CSS — loaded async (non-blocking) ─────────────────
         media="print" trick: browser fetches it at low priority (non-blocking),
         onload swaps media to "all" so it applies normally once downloaded.
    ──────────────────────────────────────────────────────────────────────── -->
    <link
      rel="stylesheet"
      href="/bootstrap.min.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="/bootstrap.min.css" />
    </noscript>

    <!-- ─── Bootstrap Icons CSS — non-blocking (preload → swap) ──────── -->
    <link
      rel="preload"
      href="/bootstrap-icons.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="/bootstrap-icons.css" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
