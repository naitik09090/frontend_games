<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Hub – Play Free Online Games</title>
    <meta name="description" content="Play a collection of free online games including puzzle, sorting, and adventure games. Fun for all ages!" />

    <!-- ─── Critical inline CSS ───────────────────────────────────────────
         Paint the page background & baseline immediately — zero blocking.
         Keeps the viewport from flashing white while the full bundle loads.
    ──────────────────────────────────────────────────────────────────────── -->
    <style>
      :root {
        --bs-body-bg: #0f0c29;
        --bs-body-color: #fff;
      }
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{
        min-height:100vh;
        background:var(--bs-body-bg);
        color:var(--bs-body-color);
        font-family:'Outfit','Inter',system-ui,sans-serif;
        -ms-overflow-style:none;
        scrollbar-width:none;
      }
      body::-webkit-scrollbar{display:none}
      #root{min-height:100vh}
      /* Skeleton loader so page looks alive before React hydrates */
      #root:empty::after{
        content:'';
        display:block;
        width:40px;height:40px;
        margin:40vh auto 0;
        border:3px solid rgba(0,210,255,.3);
        border-top-color:#00d2ff;
        border-radius:50%;
        animation:_spin .75s linear infinite;
      }
      @keyframes _spin{to{transform:rotate(360deg)}}

      /* Bootstrap Icons font — font-display:swap prevents CLS from icon font swap */
      @font-face {
        font-family: "bootstrap-icons";
        src: url("/bootstrap-icons.woff2") format("woff2");
        font-display: swap;
        font-weight: normal;
        font-style: normal;
      }
      .bi::before,
      [class^="bi-"]::before,
      [class*=" bi-"]::before {
        display: inline-block;
        font-family: bootstrap-icons !important;
        font-style: normal;
        font-weight: normal !important;
        font-variant: normal;
        text-transform: none;
        line-height: 1;
        vertical-align: -.125em;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .bi-arrows-fullscreen::before { content: "\f14d" }
      .bi-box-arrow-right::before { content: "\f1c3" }
      .bi-chevron-left::before { content: "\f284" }
      .bi-controller::before { content: "\f2d4" }
      .bi-exclamation-triangle::before { content: "\f33b" }
      .bi-fullscreen-exit::before { content: "\f3de" }
      .bi-fullscreen::before { content: "\f3df" }
      .bi-list::before { content: "\f479" }
      .bi-pencil-square::before { content: "\f4ca" }
      .bi-person-check-fill::before { content: "\f4d5" }
      .bi-speedometer2::before { content: "\f580" }
      .bi-three-dots-vertical::before { content: "\f5d3" }
      .bi-trash::before { content: "\f5de" }
      .bi-x-lg::before { content: "\f659" }
    </style>

    <!-- Preconnects removed to satisfy Lighthouse "Unused preconnect" rule (fonts and icons are loaded locally) -->

    <!-- ─── Bootstrap CSS ────────────────────────────────────────────────
         MUST be render-blocking: Bootstrap sets fundamental layout rules
         (box model, flex, grid, spacing) used on every element. Loading it
         async (media=print trick) caused CLS 0.400 because all Bootstrap
         styles applied AFTER initial paint, shifting every element at once.
         Preload tells the browser to fetch it at high priority so blocking
         time is minimal (typically < 50ms on fast connections).
    ──────────────────────────────────────────────────────────────────────── -->
    <link rel="preload" href="/bootstrap.min.css" as="style" />
    <link rel="stylesheet" href="/bootstrap.min.css" />

    <!-- Bootstrap Icons CSS is completely inlined above to eliminate render-blocking network requests -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
