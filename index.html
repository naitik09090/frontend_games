<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Hub – Play Free Online Games</title>
    <meta name="description" content="Play a collection of free online games including puzzle, sorting, and adventure games. Fun for all ages!" />

    <!-- Preconnect to CDN so DNS + TLS resolve early -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Load Bootstrap Icons CSS non-blocking (no longer render-blocking) -->
    <link
      rel="preload"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    </noscript>

    <!-- Override font-display to swap so text stays visible while icon font loads -->
    <style>
      @font-face {
        font-family: "bootstrap-icons";
        src: url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/fonts/bootstrap-icons.woff2") format("woff2");
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
